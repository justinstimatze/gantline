name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - run: sudo apt-get update && sudo apt-get install -y tmux jq
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go vet -tags realclaude ./e2e
      - run: go test -race -count=1 ./...

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      # macOS ships bash 3.2; the fake Claude Code screen needs a current one.
      - run: brew install tmux jq bash
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: govulncheck ./...
        working-directory: e2e/testdata/echomcp
