name: e2e

# The real Claude Code tests in e2e/, on a GitHub-hosted runner. Each run
# starts real Haiku sessions and a Sonnet relaunch, so it runs only when
# started by hand. It logs in with the CLAUDE_CODE_OAUTH_TOKEN secret (from
# `claude setup-token`, used against a Claude subscription) or, failing
# that, the ANTHROPIC_API_KEY secret, which bills API usage.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        options: [macos-latest, ubuntu-latest]
        default: macos-latest
      tests:
        description: Which tests
        type: choice
        options: [all, self-control, scenarios]
        default: all
      term:
        description: tmux default-terminal for the test sessions (default keeps tmux's own)
        type: choice
        options: [default, screen-256color, xterm-256color, tmux-256color]
        default: default
      rows:
        description: Height of the self-control pane (default is 40 on macOS, 16 on Linux)
        type: choice
        options: [default, '16', '40']
        default: default
      start_small:
        description: Start the self-control pane at 56x16 instead of resizing it there
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # The login secrets go only to the steps that need them, never to the
    # checkout, toolchain, brew, apt or npm install steps.
    env:
      CLAUDE_CODE_VERSION: 2.1.332
    steps:
      - name: Check a login secret is set
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" || { echo "Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret first."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.x'
      - name: Install tmux and jq
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux jq bash; else sudo apt-get update && sudo apt-get install -y tmux jq psmisc; fi
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" && claude --version
      - name: Set up a Claude Code home for the runner
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
        # Onboarding done, an API key pre-approved (Claude Code keys approval
        # on its last 20 characters; a token needs none), and tools allowed
        # without prompts on this throwaway machine. A project ask rule still
        # beats these allows.
        run: |
          mkdir -p ~/.claude
          k=""; [ -n "$ANTHROPIC_API_KEY" ] && k="${ANTHROPIC_API_KEY: -20}"
          jq -n --arg k "$k" --arg v "$CLAUDE_CODE_VERSION" \
            '{hasCompletedOnboarding: true, lastOnboardingVersion: $v, theme: "dark",
              customApiKeyResponses: {approved: ([$k] | map(select(. != ""))), rejected: []}}' > ~/.claude.json
          echo '{"permissions": {"allow": ["Bash", "Write", "Edit", "Read"]}}' > ~/.claude/settings.json
      - name: TestSelfControl in a short pane
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
        if: inputs.tests != 'scenarios'
        run: GANTLINE_E2E_TERM=${{ inputs.term != 'default' && inputs.term || '' }} GANTLINE_E2E_ROWS=${{ inputs.rows != 'default' && inputs.rows || '' }} GANTLINE_E2E_LIVE=1 GANTLINE_E2E_START_SMALL=${{ inputs.start_small && '1' || '' }} go test -tags realclaude ./e2e -run TestSelfControl -count=1 -v -timeout 15m
      - name: TestScenarios
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
        if: inputs.tests != 'self-control' && !cancelled()
        run: go test -tags realclaude ./e2e -run TestScenarios -count=1 -v -timeout 20m
      - name: Remove relaunch files before upload
        # A relaunch writes the session's whole environment, login secret
        # included, to panes/*/launch-*.json and deletes it once the new
        # claude starts. A test stopped in between leaves it behind, and
        # artifacts of a public repo are public.
        if: failure()
        run: find ~/.local/state/gantline/panes -name 'launch-*.json' -delete 2>/dev/null || true
      - name: Keep failure screens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-screens-${{ inputs.os }}
          # The screens, each pane's journal and queue, and the runner and say logs
          path: |
            ~/.local/state/gantline/corpus/
            ~/.local/state/gantline/panes/
            ~/.local/state/gantline/q.log
            ~/.local/state/gantline/say.jsonl
          if-no-files-found: ignore
